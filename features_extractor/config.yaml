hardware:
  device: "auto"  # "auto" | "cuda:0" | "cpu"
  batch_size: 16

models:
  spacy:
    model: "en_core_web_trf"  # "en_core_web_trf" for GPU, "en_core_web_lg" for CPU fallback
  languagetool:
    server_port: 8081
    language: "en-CA"
  surprisal:
    enabled: true  # Gates the SurprisalPass; flip to false to skip surp_* features.
    model: "EleutherAI/pythia-70m"  # Replicates Gruteke Klein et al. 2025 (arXiv:2502.11150).

cache:
  enabled: true
  directory: "./cache"
  format: "parquet"
  checkpoint_chunk_size: 500  # essays per checkpoint increment

dataset:
  path: "./src/feature_extractor/data/processed/asap-pp-3456-language-norm.csv"
  columns:
    essay_id: "essay_id"
    text: "essay_deanonymized"
    score: "language_norm"
    prompt_id: "essay_set"

features:
  #add specific override defaults here, ie
  #dep_mdd_mean: false , or,
  #spell_far_misspellings_count: true
  overrides: {}

scoring:
  score_min: 0.0
  score_max: 1.0
  normalise: true