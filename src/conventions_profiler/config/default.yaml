hardware:
  device: "auto"  # "auto" | "cuda:0" | "cpu"
  batch_size: 16

models:
  spacy:
    model: "en_core_web_trf"  # "en_core_web_trf" for GPU, "en_core_web_lg" for CPU fallback
  languagetool:
    server_port: 8081
    language: "en-US"

cache:
  enabled: true
  directory: "./cache"
  format: "parquet"

datasets:
  asap_pp:
    path: "./src/conventions_profiler/data/processed/asap_pp_conventions.csv"
