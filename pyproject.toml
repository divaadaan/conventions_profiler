[project]
name = "conventions-profiler"
version = "0.1.0"
description = "Conventions profiler monorepo — linguistic feature extraction and scoring for automated essay scoring."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
